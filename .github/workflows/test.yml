name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the helper compiles
        run: python3 -m py_compile bin/airplay-ctl tests/fakes/*
      - name: Check the manifest and strings are valid JSON
        run: jq -e . manifest.json i18n/en.json > /dev/null
      - name: Run tests
        run: node --test "tests/*.test.js"
